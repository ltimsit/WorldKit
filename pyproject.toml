[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "worldkit"
version = "0.1.0"
description = "Outil de worldbuilding pour MJ-auteur de JDR (nom provisoire)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "httpx>=0.27"]
ui = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1", "python-multipart>=0.0.9", "markdown-it-py>=3"]

[project.scripts]
worldkit = "worldkit.cli:main"

[tool.setuptools.packages.find]
include = ["worldkit*"]

[tool.setuptools.package-data]
"worldkit.web" = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
