# Profils de modèles et routage par tâche (T-LLM-01). Copier en worldkit-llm.yaml pour l'utiliser.
# Adaptateurs : claude-code (abonnement, usage personnel, via « claude -p »), anthropic-api (clé d'API),
# ollama (modèle local). « concurrency » : appels simultanés (défaut 4).
# « temperature » : envoyée seulement si donnée (Haiku 4.5 l'accepte, Sonnet 5 la refuse).
# « price » : dollars par million de tokens (entrée, sortie), pour le coût de chaque appel (tarifs du 24 juin 2026).
# ollama : « num_ctx » fenêtre de contexte (16384 par défaut ; celle d'Ollama tronque sans le dire),
# « think » réflexion des modèles qui en ont une (coupée par défaut, très lente), « concurrency: 1 » sur une seule carte.
# « effort » est refusé par Haiku 4.5. Budget d'entrée par appel : variable WORLDKIT_LLM_INPUT_BUDGET (4000 par défaut).
profiles:
  haiku:      { adapter: claude-code, model: claude-haiku-4-5 }
  sonnet:     { adapter: claude-code, model: claude-sonnet-5 }
  api-haiku:  { adapter: anthropic-api, model: claude-haiku-4-5, temperature: 0, price: { input: 1.0, output: 5.0 } }
  api-sonnet: { adapter: anthropic-api, model: claude-sonnet-5, price: { input: 2.0, output: 10.0 } }
  local:      { adapter: ollama, model: qwen2.5:7b }
  qwen3-4b:   { adapter: ollama, model: qwen3:4b, num_ctx: 16384, concurrency: 1 }
tasks:
  extraction: sonnet
